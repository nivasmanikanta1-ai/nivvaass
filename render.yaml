services:
  - type: web
    name: smart-training-centre-finder
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-training-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: smart-training-db
    plan: free
