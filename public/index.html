<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Training Centre Finder</title><link rel="stylesheet" href="/style.css"></head><body><header><b>Smart Training Centre Finder</b><span>Kakinada District</span><div id="user"></div></header><main><section id="auth"><div class="hero"><small>KAKINADA DISTRICT</small><h1>Find training centres near you.</h1><p>Login, search an area, view courses and open the route directly in Google Maps.</p></div><div class="box"><div class="tabs"><button id="lt">Login</button><button id="rt">Register</button></div><form id="login"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button>Login</button></form><form id="register" class="hide"><input id="rn" placeholder="Name" required><input id="re" type="email" placeholder="Email" required><input id="rp" type="password" minlength="6" placeholder="Password (6+)" required><button>Create account</button></form><p id="msg"></p></div></section><section id="app" class="hide"><div class="head"><div><small>DISCOVER</small><h2>Training centres around Kakinada</h2><p>Search Bhanugudi, Ramanayyapeta, Gandhi Chowk, etc.</p></div><button id="loc" class="secondary">Use my location</button></div><div class="search"><div><input id="q" placeholder="Enter area / location"><button id="search">Search</button></div><div><input id="course" placeholder="Filter by course e.g. AWS, Python, AutoCAD"><button id="all" class="secondary">Show all</button></div><p id="status"></p></div><div id="list"></div></section></main><div id="modal" class="hide"><div class="modal"><button id="close">×</button><div id="detail"></div></div></div><script src="/app.js"></script></body></html>
